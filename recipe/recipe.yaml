schema_version: 1

context:
  version: "0.1.18"

package:
  name: setuptools-gettext
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/setuptools-gettext/setuptools_gettext-${{ version }}.tar.gz
  sha256: c92b0ae486def502686cd944f16559819e42f8dc0b9d683cf62e7415397f2b35

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - pip
    - python =${{ python_min }}
    - setuptools
  run:
    - python >=${{ python_min }}
    - setuptools
    - tomli

tests:
  - python:
      imports:
        - setuptools_gettext
  - requirements:
      run:
        - pip
        - python =${{ python_min }}
    script:
      - pip check

about:
  summary: Setuptools gettext extension plugin
  license: GPL-2.0-or-later
  license_file: COPYING
  homepage: https://github.com/breezy-team/setuptools-gettext

extra:
  recipe-maintainers:
    - danielnachun
